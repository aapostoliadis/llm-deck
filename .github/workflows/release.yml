name: Release

# Pushing a tag like v1.2.0 publishes that version's GitHub release, with its section of CHANGELOG.md as the notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test test/*.test.js

      - name: Notes from CHANGELOG.md
        run: node tools/release-notes.js "$GITHUB_REF_NAME" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "LLM Deck ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag --latest
