  .stroke { stroke: var(--gear); }
  .lbl { font: 600 15px -apple-system, "Segoe UI", system-ui, sans-serif; fill: #5A6878; }
  @media (prefers-color-scheme: dark) {
    svg { --gear:#0B1220; --acc:#D3DCE8; --gear-soft:#2B3A52; }
    .lbl { fill: #93A3B8; }
  }
</style>
